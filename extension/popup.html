<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Intel Connector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <span class="brand-name">Sales Intel</span>
      </div>
      <span id="envBadge" class="badge badge-local">LOCAL</span>
    </div>

    <!-- 1. Sales Intel Connection Status (independent from Google Maps) -->
    <div id="connectionStatus" class="status-banner disconnected">
      <span class="status-dot"></span>
      <div class="status-content">
        <span id="statusTitle" class="status-title">Checking connection…</span>
        <span id="statusUser" class="status-sub"></span>
      </div>
    </div>

    <!-- 2. Google Maps Tab Detection (independent from SI connection) -->
    <div class="card maps-card">
      <div class="card-header-compact">
        <span id="mapsDot" class="maps-dot gray"></span>
        <span class="card-title-sm">GOOGLE MAPS</span>
      </div>
      <div class="card-body-compact">
        <p id="mapsStatusTitle" class="maps-status-title">Checking active tab...</p>
        <p id="queryInfo" class="query-text hidden"></p>
        <p id="detectedInfo" class="detected-text"></p>
      </div>
    </div>

    <!-- 3. Search Result Cards — Mode A Controls -->
    <div class="card mode-card">
      <div class="card-title">SEARCH RESULT CARDS</div>

      <!-- Pre-extraction mini stats (populated once results are detected) -->
      <div id="cardStats" class="card-stats hidden">
        <div class="stat-inline"><span class="stat-label">Qualified</span><span id="statQualifiedLive" class="stat-val-inline">0</span></div>
        <div class="stat-inline"><span class="stat-label">Skipped</span><span id="statSkippedLive" class="stat-val-inline">0</span></div>
        <div class="stat-inline"><span class="stat-label">Duplicates</span><span id="statDuplicatesLive" class="stat-val-inline">0</span></div>
      </div>

      <div class="form-group">
        <label for="importLimit">Maximum results</label>
        <select id="importLimit" class="form-select">
          <option value="5">5 results</option>
          <option value="10" selected>10 results</option>
          <option value="20">20 results</option>
          <option value="30">30 results</option>
          <option value="50">50 results</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="actions-primary">
        <button id="quickCsvBtn" class="btn btn-secondary" disabled>Download CSV</button>
        <button id="extractBtn" class="btn btn-primary" disabled>Import to Sales Intel</button>
        <button id="stopBtn" class="btn btn-danger hidden">Stop Extraction</button>
      </div>

      <!-- Not connected hint for import -->
      <p id="importHint" class="import-hint hidden">Connect Sales Intel to import leads.</p>

      <!-- Progress Section -->
      <div id="progressContainer" class="progress-section hidden">
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <p id="progressText" class="progress-text">Extracting &amp; validating leads...</p>
      </div>
    </div>

    <!-- 4. Summary Card (After Extraction) -->
    <div id="resultSummary" class="card summary-card hidden">
      <div class="summary-header">
        <span id="summaryTitle" class="summary-title">Discovery Complete</span>
      </div>
      <div class="stats-grid">
        <div class="stat-item"><span class="stat-label">Detected</span><span id="statDiscovered" class="stat-val">0</span></div>
        <div class="stat-item"><span class="stat-label">Qualified</span><span id="statQualified" class="stat-val">0</span></div>
        <div class="stat-item"><span class="stat-label">Skipped</span><span id="statSkipped" class="stat-val">0</span></div>
        <div class="stat-item"><span class="stat-label">Duplicates</span><span id="statDuplicates" class="stat-val">0</span></div>
        <div class="stat-item highlight"><span class="stat-label">Ready</span><span id="statReady" class="stat-val">0</span></div>
      </div>
      <div class="actions-stacked mt-2">
        <button id="downloadCsvBtn" class="btn btn-secondary">Download CSV</button>
        <button id="importBackendBtn" class="btn btn-primary">Import to Sales Intel</button>
      </div>
    </div>

    <!-- 5. Footer Navigation Links -->
    <div class="footer-links">
      <button id="openAppBtn" class="link-btn">Open Sales Intel</button>
      <button id="viewLeadsBtn" class="link-btn">View Leads</button>
      <button id="settingsBtn" class="link-btn">Settings</button>
      <button id="reconnectBtn" class="link-btn">Reconnect</button>
    </div>
  </div>

  <script src="shared/constants.js"></script>
  <script src="shared/environment.js"></script>
  <script src="popup.js"></script>
</body>
</html>
